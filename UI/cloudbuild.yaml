substitutions:
  _REGION: us-central1
  _LOCATION: us-central1
  _REPO: fantasysgpsystem
  _SERVICE: sgp-viewer
  _IMAGE_NAME: sgp-viewer

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DATE_TAG="v_$(date +%y%m%d)"
        IMG="${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}"

        echo "Workspace:"
        ls -la
        echo "Building $$IMG:$BUILD_ID and $$IMG:$$DATE_TAG"

        docker build -t "$$IMG:$BUILD_ID" -t "$$IMG:$$DATE_TAG" .
        docker push "$$IMG:$BUILD_ID"
        docker push "$$IMG:$$DATE_TAG"
        echo "$$DATE_TAG" > /workspace/DATE_TAG.txt

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DATE_TAG="$(cat /workspace/DATE_TAG.txt)"
        IMG="${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:$$DATE_TAG"

        echo "Deploying $$IMG"
        gcloud run deploy "${_SERVICE}" \
          --image "$$IMG" \
          --region "${_REGION}" \
          --allow-unauthenticated \
          --service-account "sgp-gcs-access@$PROJECT_ID.iam.gserviceaccount.com" \
          --memory "1Gi" \
          --min-instances "0" \
          --max-instances "3"