substitutions:
  _REGION: us-central1
  _JOB_NAME: inseason-job
  _IMAGE_NAME: inseason-sgp
  _REPO: gcr.io
  _CACHE_IMAGE: ${_IMAGE_NAME}-cache

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  requestedVerifyOption: VERIFIED

steps:
  # ── Step 1: Build & push the job image with layer caching ───────────────
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DATE_TAG="v_$(date +%y%m%d)"
        IMG="gcr.io/$PROJECT_ID/${_IMAGE_NAME}"
        CACHE_IMG="gcr.io/$PROJECT_ID/${_CACHE_IMAGE}"

        echo "Building $$IMG:$BUILD_ID and $$IMG:$$DATE_TAG with cache"
        docker buildx create --use --name sgp-builder >/dev/null 2>&1 || docker buildx use sgp-builder
        docker buildx build \
          --file Dockerfile.job \
          --cache-from type=registry,ref=$$CACHE_IMG:latest \
          --cache-to type=registry,ref=$$CACHE_IMG:latest,mode=max \
          --tag "$$IMG:$BUILD_ID" \
          --tag "$$IMG:$$DATE_TAG" \
          --tag "$$IMG:latest" \
          --push \
          .
        echo "$$DATE_TAG" > /workspace/DATE_TAG.txt

  # ── Step 2: Update the Cloud Run Job to the new image ───────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DATE_TAG="$(cat /workspace/DATE_TAG.txt)"
        IMG="gcr.io/$PROJECT_ID/${_IMAGE_NAME}:$$DATE_TAG"

        echo "Updating Cloud Run Job ${_JOB_NAME} → $$IMG"
        if gcloud run jobs describe "${_JOB_NAME}" --region "${_REGION}" >/dev/null 2>&1; then
          gcloud run jobs update "${_JOB_NAME}" \
            --image "$$IMG" \
            --region "${_REGION}" \
            --memory "1Gi" \
            --service-account "sgp-gcs-access@$PROJECT_ID.iam.gserviceaccount.com" \
            --set-secrets=FANGRAPHS_USERNAME=fangraphs-username:latest,FANGRAPHS_PASSWORD=fangraphs-password:latest
        else
          gcloud run jobs create "${_JOB_NAME}" \
            --image "$$IMG" \
            --region "${_REGION}" \
            --memory "1Gi" \
            --service-account "sgp-gcs-access@$PROJECT_ID.iam.gserviceaccount.com" \
            --set-secrets=FANGRAPHS_USERNAME=fangraphs-username:latest,FANGRAPHS_PASSWORD=fangraphs-password:latest
        fi
        echo "[✓] Job updated: ${_JOB_NAME}"

  # ── Step 3: Execute the job (runs it immediately after deploy) ───────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Executing Cloud Run Job ${_JOB_NAME}..."
        gcloud run jobs execute "${_JOB_NAME}" \
          --region "${_REGION}" \
          --wait
        echo "[✓] Job execution complete"
