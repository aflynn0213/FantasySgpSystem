<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP Rankings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container">

    <h1 class="mt-4 text-center">SGP Rankings</h1>
    
    <!-- Refresh Button -->
    <div class="text-center mb-4">
        <a href="/refresh" class="btn btn-primary">Refresh SGP Rankings</a>
    </div>

    <!-- Hitters Section -->
    <h2 class="mt-4">Hitters Rankings</h2>
    <div class="table-responsive">
        {{ hitters_html|safe }}
    </div>

    <!-- Pitchers Section -->
    <h2 class="mt-4">Pitchers Rankings</h2>
    <div class="table-responsive">
        {{ pitchers_html|safe }}
    </div>

    <!-- Combined Rankings Section -->
    <h2 class="mt-4">Overall Rankings</h2>
    <div class="table-responsive">
        {{ combined_html|safe }}
    </div>

</body>
</html>
