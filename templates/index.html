<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP Rankings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container mt-4">

    <h1 class="text-center">SGP Rankings</h1>

    <!-- 🔹 Projection Dropdown -->
    <div class="mb-3 text-center">
        <label for="projection" class="form-label">Select Projection:</label>
        <select id="projection" class="form-select w-25 d-inline-block" onchange="updateProjection()">
            <option value="atc" {% if selected_proj == 'atc' %}selected{% endif %}>ATC</option>
            <option value="oopsy" {% if selected_proj == 'oopsy' %}selected{% endif %}>OOPSY</option>
            <option value="current" {% if selected_proj == 'current' %}selected{% endif %}>Current</option>
        </select>
    </div>

    <!-- 🔹 Navigation Tabs -->
    <ul class="nav nav-tabs" id="sgpTabs">
        <li class="nav-item">
            <a class="nav-link active" id="hitters-tab" data-bs-toggle="tab" href="#hitters">Hitters</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="pitchers-tab" data-bs-toggle="tab" href="#pitchers">Pitchers</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="combined-tab" data-bs-toggle="tab" href="#combined">Combined Rankings</a>
        </li>
    </ul>

    <!-- 🔹 Tab Content -->
    <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="hitters">
            <h2>Hitters Rankings</h2>
            <div class="table-responsive">
                {{ hitters_html|safe }}
            </div>
        </div>
        <div class="tab-pane fade" id="pitchers">
            <h2>Pitchers Rankings</h2>
            <div class="table-responsive">
                {{ pitchers_html|safe }}
            </div>
        </div>
        <div class="tab-pane fade" id="combined">
            <h2>Overall Rankings</h2>
            <div class="table-responsive">
                {{ combined_html|safe }}
            </div>
        </div>
    </div>

    <!-- 🔹 Refresh Button -->
    <div class="text-center mt-4">
        <a href="/refresh" class="btn btn-primary">Refresh SGP Rankings</a>
    </div>

    <script>
        // 🔹 Function to update projection based on dropdown selection
        function updateProjection() {
            const selectedProjection = document.getElementById("projection").value;
            window.location.href = `/?projection=${selectedProjection}`;
        }
    </script>

</body>
</html>
