# config.yml

# Set to false on machines without GCS credentials to skip all uploads/downloads.
use_gcs: true

defaults:
  weeks_in_season: 26
  num_teams: 10
  num_bats: 10
  num_starters: 10
  num_relievers: 2

hitter_position_counts:
  C:  1
  1B: 1
  2B: 1
  3B: 1
  SS: 1
  MI: 0
  CI: 0
  OF: 3
  UTIL: 2

position_priority: ["C", "2B", "OF", "SS", "3B", "1B", "DH"]

league_params:
  workbook_path: "included/leaguehistory.xlsx"
  parameters_sheet: "Parameters"

categories:
  hitters:
    counting: ["R", "HR", "RBI", "SB"]
    rate:
      - [ "OBP", "PA_SH" ]
      - [ "SLG", "AB" ]

  pitchers:
    counting: ["QS", "SV_HLD", "SO"]
    rate:
      - [ "ERA", "IP" ]
      - [ "WHIP", "IP" ]
      - [ "K/BB", "BB" ]

# Points league scoring weights.  Set a stat to 0 to exclude it from totals.
points:
  hitters:
    # Plate appearance / at-bat (rarely scored, kept for reference)
    PA:   0
    AB:   0
    # Hit types — a single counts as 1B only (H=0 avoids double-counting)
    H:    1
    1B:   1      # single
    2B:   2      # double
    3B:   3      # triple
    HR:   4      # home run
    # Run-production
    R:    1      # run scored
    RBI:  1      # run batted in
    # Walks / on-base
    BB:   1      # walk
    IBB:  1      # intentional walk
    HBP:  1      # hit by pitch
    # Baserunning
    SB:   1      # stolen base
    CS:   0      # caught stealing
    # Strikeout penalty
    SO:   0
    # Sacrifice — not typically scored
    SF:   0
    SH:   0

  pitchers:
    IP:   2      # innings pitched  (3 pts/IP is the standard ESPN default)
    W:    5      # win
    L:   -3      # loss
    SV:   5      # save
    HLD:  4      # hold
    QS:   3      # quality start  (6+ IP, ≤3 ER)
    SO:   1.5      # strikeout
    ER:  -1      # earned run allowed
    R:    0      # unearned runs (set to -1 if your league uses R instead of ER)
    H:    0      # hit allowed (some leagues use -0.25)
    HR:   0      # home run allowed
    BB:  -0.25    # walk issued
    HBP: -0.25    # hit by pitch
      
export:
  output_dir: "outputs"
  # Set to true to also write separate per-player-type xlsx files via the utils
  # export helpers in addition to the combined workbook.  Off by default.
  separate_files: false

# FanGraphs Auction Calculator settings.
# These drive the URL built dynamically in refresh_excel_projections.py.
auction_calculator:
  dollars: 260               # Total auction budget per team
  hitter_pitcher_split: 65   # % of budget allocated to hitters
  min_bid: 1                 # Minimum bid
  bench: 4                   # Total bench/reserve spots

  # Order in which FanGraphs prioritizes assigning players to roster slots.
  position_priority: [C, 2B, OF, SS, 3B, 1B]
